name: Keeper

# Runs one keeper pass on a schedule instead of as a long-running process (see ADR 0008):
# no server to pay for, but a fresh process every run, so the "how long has this looked
# suspicious" clock (ADR 0003 in the keeper) is persisted on its own branch and restored
# before each pass. GitHub may delay or occasionally skip a scheduled run under load; the
# heartbeat below is what actually notices if runs stop happening.
#
# The same branch also carries the oracle's status after each pass (--status-file), which
# damper-frontend's status page reads, the same way damper-backend's own report reads
# `reports`. See ADR 0009.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Restore the suspicious-move clock from the last pass
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/keeper-state/keeper-state.json" -o data/keeper-state.json.tmp \
            && mv data/keeper-state.json.tmp data/keeper-state.json \
            || echo "no previous state (first run, or none published yet)"

      - name: Keeper pass
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          DAMPER_ORACLE: ${{ vars.DAMPER_ORACLE }}
          DAMPER_NETWORK: ${{ vars.DAMPER_NETWORK }}
          DAMPER_SUBMIT: ${{ vars.DAMPER_SUBMIT }}
          DAMPER_POOL: ${{ vars.DAMPER_POOL }}
          DAMPER_EXPOSURE_USD: ${{ vars.DAMPER_EXPOSURE_USD }}
          DAMPER_WEBHOOK_FORMAT: ${{ vars.DAMPER_WEBHOOK_FORMAT }}
          DAMPER_ALERT_MIN: ${{ vars.DAMPER_ALERT_MIN }}
          DAMPER_KEEPER_SECRET: ${{ secrets.DAMPER_KEEPER_SECRET }}
          DAMPER_ALERT_WEBHOOK: ${{ secrets.DAMPER_ALERT_WEBHOOK }}
          DAMPER_HEARTBEAT_URL: ${{ secrets.DAMPER_HEARTBEAT_URL }}
        run: npm run keeper -- --once --state data/keeper-state.json --status-file data/oracle-status.json

      - name: Publish the suspicious-move clock and the oracle's status for the next pass and the dashboard
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish
          cp data/keeper-state.json publish/keeper-state.json 2>/dev/null \
            || echo '{"updatedAt":"1970-01-01T00:00:00.000Z","suspicious":{},"notify":{}}' > publish/keeper-state.json
          # No status file means the pass failed before it could read the oracle; publishing
          # nothing would leave the dashboard showing a stale report with no sign it is stale,
          # so an empty, clearly-timestamped one is published instead.
          cp data/oracle-status.json publish/oracle-status.json 2>/dev/null \
            || echo "{\"at\":$(date -u +%s),\"network\":\"${{ vars.DAMPER_NETWORK || 'mainnet' }}\",\"oracle\":\"${{ vars.DAMPER_ORACLE }}\",\"assets\":[]}" > publish/oracle-status.json
          # Fails the run if StatusReport (src/keeper/status.ts) has drifted from
          # schemas/oracle-status.schema.json (#15). Skipped for the synthesized empty
          # fallback above, which is handwritten to match the schema and not worth a tsx
          # startup in a path that `if: always()` can also hit on a failed checkout.
          if [ -f data/oracle-status.json ]; then
            npm run validate-report -- schemas/oracle-status.schema.json publish/oracle-status.json
          fi
          cp schemas/oracle-status.schema.json publish/oracle-status.schema.json
          cd publish
          git init -q -b keeper-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Keeper state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" keeper-state
